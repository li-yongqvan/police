# Hong Kong / domestic edge reverse proxy for AI智联平台
# Users (mobile CN) -> HTTPS :443 here -> origin US VPS :8888
#
# Setup:
#   1. Copy to edge VPS: /etc/nginx/conf.d/ai-forum-edge.conf
#   2. Set ORIGIN_HOST (US server IP) and server_name (your domain)
#   3. certbot --nginx -d your.domain.example
#   4. Open firewall: 443/tcp

proxy_cache_path /var/cache/nginx/ai-forum levels=1:2 keys_zone=ai_forum_assets:10m max_size=200m inactive=7d;

upstream us_origin {
    # US origin (docker-compose.server.yml publishes forum gateway on 8888)
    server ORIGIN_HOST:8888;
    keepalive 16;
}

server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    # certbot will inject ssl_certificate paths; placeholders for first boot:
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location /assets/ {
        proxy_cache ai_forum_assets;
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_pass http://us_origin;
    }

    location /user-api/ {
        proxy_pass http://us_origin;
    }

    location /forum-api/ {
        proxy_pass http://us_origin;
    }

    location /admin-api/ {
        proxy_pass http://us_origin;
    }

    location / {
        proxy_pass http://us_origin;
    }
}
