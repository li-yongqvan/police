# Domestic CN: pull base images via DaoCloud mirror (when Docker Hub times out).
# Usage: docker compose -f docker-compose.yml -f docker-compose.server.yml -f docker-compose.cn-mirror.yml ...

services:
  frontend:
    build:
      args:
        NODE_IMAGE: docker.m.daocloud.io/library/node:20-alpine
        NGINX_IMAGE: docker.m.daocloud.io/library/nginx:alpine
  forum-service:
    build:
      args:
        GO_IMAGE: docker.m.daocloud.io/library/golang:1.23-alpine
        ALPINE_IMAGE: docker.m.daocloud.io/library/alpine:3.19
  nginx:
    image: docker.m.daocloud.io/library/nginx:alpine
  postgres:
    image: docker.m.daocloud.io/library/postgres:16
  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
