server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never rewrite missing static chunks to index.html, otherwise
    # browsers receive text/html for module scripts and throw MIME errors.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Ensure shell HTML is always fresh after each deployment.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

