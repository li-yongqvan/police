services:
  # === API Gateway ===
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/includes:/etc/nginx/includes:ro
    depends_on:
      - user-service
      - admin-service
      - frontend
    networks:
      - ai-forum-net

  # === User Service ===
  user-service:
    build:
      context: ./services/user
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_SCHEMA=schema_auth
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai-forum-net

  # === Admin Service ===
  admin-service:
    build:
      context: ./services/admin
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_SCHEMA=schema_admin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai-forum-net

  # === PostgreSQL ===
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_forum
      POSTGRES_USER: ai_forum
      POSTGRES_PASSWORD: ai_forum_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/init/000_init_schemas.up.sql:/docker-entrypoint-initdb.d/001_init_schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_forum"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ai-forum-net

  # === Redis ===
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ai-forum-net

  # === Frontend ===
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - user-service
      - admin-service
    networks:
      - ai-forum-net

volumes:
  pgdata:
  uploads:

networks:
  ai-forum-net:
    driver: bridge